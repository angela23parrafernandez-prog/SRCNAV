
<ion-content [fullscreen]="true">
  <!-- Contenedor principal -->
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo -->
      <div class="logo-container">
        <ion-img src="assets/img/prueba.png" alt="Logo Armada de Colombia"></ion-img>
      </div>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <h4 color="medium" class="footer-textt">Inicio sesión</h4>
        <ion-item>
          <ion-label position="floating">Cédula</ion-label>
          <ion-input
            type="text"
            maxlength="10"
            formControlName="cedula"
            inputmode="numeric"
            autocomplete="off"
          ></ion-input>
        </ion-item>

        <ion-note
          *ngIf="loginForm.get('cedula')?.invalid && loginForm.get('cedula')?.touched"
          color="danger"
        >
          La cédula debe tener exactamente 10 dígitos
        </ion-note>

        <ion-item class="ion-margin-top">
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input
            type="password"
            formControlName="contrasena"
            autocomplete="off"
          ></ion-input>
        </ion-item>

        <ion-button
          expand="block"
          class="ion-margin-top login-btn"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          INGRESAR
        </ion-button>
      </form>

      <ion-text color="medium" class="footer-text">
        <small>© 2025 Armada de Colombia</small>
      </ion-text>
    </div>
  </div>
</ion-content>
