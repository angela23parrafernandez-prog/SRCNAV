<ion-content class="fondo">
  <div  class="layout">
    <!-- Sidebar vertical -->
    <aside class="sidebar">
      <div class="logo-container">
        <ion-img src="assets/img/prueba.png" alt="Logo"></ion-img>
        <h2>Mi Plataforma</h2>
      </div>
      <nav class="menu">
        <ion-icon name="home-outline"></ion-icon>
        <span>Inicio</span>
      </nav>
      <nav class="menu">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span>Perfil</span>
      </nav>
      <nav class="menu">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Configuración</span>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="contenido">
      <ion-grid  fixed>
        <ion-row>
          <!-- Sanidad -->
          <ion-col size="12" size-md="4">
            <ion-card button (click)="irSanidad()">
              <ion-card-header>
                <ion-icon name="medkit-outline" class="icono-modulo"></ion-icon>
                <ion-card-title> Módulo Sanidad</ion-card-title>
              </ion-card-header>
              <ion-card-content>
                Gestión de monitoreo y registros.
              </ion-card-content>
            </ion-card>
          </ion-col>

          <!-- Seguridad -->
          <ion-col size="12" size-md="4">
            <ion-card button (click)="irSeguridad()">
              <ion-card-header>
                <ion-icon name="shield-checkmark-outline" class="icono-modulo"></ion-icon>
                <ion-card-title>Otro</ion-card-title>
              </ion-card-header>
              <ion-card-content>
                Control .
              </ion-card-content>
            </ion-card>
          </ion-col>

          <!-- Energía -->
          <ion-col size="12" size-md="4">
            <ion-card button (click)="irEnergia()">
              <ion-card-header>
                <ion-icon name="flash-outline" class="icono-modulo"></ion-icon>
                <ion-card-title>Otro</ion-card-title>
              </ion-card-header>
              <ion-card-content>
                Supervisión .
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </main>
  </div>
</ion-content>
